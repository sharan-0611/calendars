<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar Picker</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 30px;
      max-width: 400px;
      width: 100%;
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 30px;
      font-size: 28px;
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      gap: 10px;
    }

    .calendar-header button {
      background: #667eea;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: background 0.2s;
    }

    .calendar-header button:hover {
      background: #764ba2;
    }

    .calendar-header h2 {
      flex: 1;
      text-align: center;
      font-size: 18px;
      color: #333;
      min-width: 150px;
    }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
      margin-bottom: 10px;
    }

    .weekday {
      text-align: center;
      font-weight: 600;
      color: #667eea;
      font-size: 12px;
      padding: 10px 0;
      text-transform: uppercase;
    }

    .days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
    }

    .day {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      color: #333;
      background: #f5f5f5;
      transition: all 0.2s;
      border: 2px solid transparent;
    }

    .day:hover:not(.day.other):not(.day.disabled) {
      background: #e0e0e0;
      transform: scale(1.05);
    }

    .day.other {
      color: #ccc;
      background: white;
      cursor: default;
    }

    .day.disabled {
      color: #ccc;
      background: #f9f9f9;
      cursor: not-allowed;
    }

    .day.selected {
      background: #667eea;
      color: white;
      font-weight: 600;
      border-color: #764ba2;
    }

    .day.today {
      border-color: #667eea;
      border-width: 2px;
    }

    .selected-date {
      margin-top: 30px;
      padding: 20px;
      background: #f5f5f5;
      border-radius: 6px;
      text-align: center;
    }

    .selected-date p {
      color: #999;
      font-size: 12px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .selected-date .date {
      font-size: 24px;
      font-weight: 600;
      color: #667eea;
    }

    .today-btn {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .today-btn:hover {
      background: #764ba2;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📅 Calendar Picker</h1>
    
    <div class="calendar-header">
      <button id="prevBtn">← Prev</button>
      <h2 id="monthYear"></h2>
      <button id="nextBtn">Next →</button>
    </div>

    <div class="weekdays">
      <div class="weekday">Sun</div>
      <div class="weekday">Mon</div>
      <div class="weekday">Tue</div>
      <div class="weekday">Wed</div>
      <div class="weekday">Thu</div>
      <div class="weekday">Fri</div>
      <div class="weekday">Sat</div>
    </div>

    <div class="days" id="daysContainer"></div>

    <div class="selected-date">
      <p>Selected Date</p>
      <div class="date" id="selectedDate">Pick a date</div>
    </div>

    <button class="today-btn" id="todayBtn">Go to Today</button>
  </div>

  <script>
    let currentDate = new Date();
    let selectedDate = null;

    const monthYear = document.getElementById('monthYear');
    const daysContainer = document.getElementById('daysContainer');
    const selectedDateDisplay = document.getElementById('selectedDate');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const todayBtn = document.getElementById('todayBtn');

    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      // Set header
      const monthNames = ['January', 'February', 'March', 'April', 'May', 'June',
        'July', 'August', 'September', 'October', 'November', 'December'];
      monthYear.textContent = `${monthNames[month]} ${year}`;

      // Clear previous days
      daysContainer.innerHTML = '';

      // Get first day of month and number of days
      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const daysInPrevMonth = new Date(year, month, 0).getDate();

      // Previous month's days
      for (let i = firstDay - 1; i >= 0; i--) {
        const day = daysInPrevMonth - i;
        const dayEl = createDayElement(day, 'other', null);
        daysContainer.appendChild(dayEl);
      }

      // Current month's days
      const today = new Date();
      for (let day = 1; day <= daysInMonth; day++) {
        const date = new Date(year, month, day);
        const isToday = date.toDateString() === today.toDateString();
        const isSelected = selectedDate && date.toDateString() === selectedDate.toDateString();
        
        const dayEl = createDayElement(day, isToday ? 'today' : '', date);
        if (isSelected) dayEl.classList.add('selected');
        
        dayEl.addEventListener('click', () => selectDate(date));
        daysContainer.appendChild(dayEl);
      }

      // Next month's days
      const totalCells = daysContainer.children.length;
      const remainingCells = 42 - totalCells;
      for (let day = 1; day <= remainingCells; day++) {
        const dayEl = createDayElement(day, 'other', null);
        daysContainer.appendChild(dayEl);
      }
    }

    function createDayElement(day, className, date) {
      const dayEl = document.createElement('div');
      dayEl.className = `day ${className}`;
      dayEl.textContent = day;
      if (date === null) dayEl.classList.add('disabled');
      return dayEl;
    }

    function selectDate(date) {
      selectedDate = date;
      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      selectedDateDisplay.textContent = date.toLocaleDateString('en-US', options);
      renderCalendar();
    }

    prevBtn.addEventListener('click', () => {
      currentDate.setMonth(currentDate.getMonth() - 1);
      renderCalendar();
    });

    nextBtn.addEventListener('click', () => {
      currentDate.setMonth(currentDate.getMonth() + 1);
      renderCalendar();
    });

    todayBtn.addEventListener('click', () => {
      currentDate = new Date();
      selectDate(new Date());
      renderCalendar();
    });

    // Initial render
    renderCalendar();
  </script>
</body>
</html>
